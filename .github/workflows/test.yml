name: AI evaluation harness

on:
  push:
  pull_request:

jobs:
  model-free-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise offline report path
        run: python src/ai_eval.py --mock --split all
